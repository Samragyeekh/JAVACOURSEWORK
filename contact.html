<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Contact Us – Lumière Cosmetics</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lato:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>

</head>
<body>

  <div class="page">

    <!-- Left: image -->
    <div class="left">
      <img src="download (10).jpeg" alt="Lumière Cosmetics"/>
    </div>

    <!-- Right: form -->
    <div class="right">

      <h1>Contact Us</h1>

      <form action="https://formspree.io/f/YOUR_ID" method="POST">

        <div class="field">
          <label>Name:</label>
          <input type="text" name="name" required/>
        </div>

        <div class="field">
          <label>Email:</label>
          <input type="email" name="email" required/>
        </div>

        <div class="field">
          <label>Message:</label>
          <input type="text" name="message" required/>
        </div>

        <div class="field">
          <label>Contact:</label>
          <div class="static-field">lumierecosmetics@gmail.com</div>
        </div>

        <div class="field">
          <label>Based in:</label>
          <div class="static-field">Kathmandu, Nepal</div>
        </div>

        <div class="bottom">
  <button type="submit">Contact us</button>
  <div class="socials">
    <a href="https://www.instagram.com/yourpage" target="_blank">
    <img class="social-icon" src="Instagram_logo_2016.svg.png" alt="instagram"/>
    </a>
    <a href="https://www.youtube.com/yourchannel" target="_blank">
    <img class="social-icon" src="Youtube_logo.png" alt="youtube"/>
    </a>
    <a href="https://www.tiktok.com/@yourpage" target="_blank">
    <img class="social-icon" src="images.jpeg" alt="tiktok"/>
    </a>
    <a href="https://www.pinterest.com/yourpage" target="_blank">
    <img class="social-icon" src="Pinterest-logo.png" alt="pinterest"/>
    </a>
  </div>
</div>

      </form>

    </div>
  </div>

</body>
</html>
