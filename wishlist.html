<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist — Lumiere Cosmetics</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ivory:    #F5EDE4;
      --soft:     #F0E4D8;
      --blush:    #EDD8C8;
      --mink:     #B89880;
      --charcoal: #3A2A20;
      --font-display: 'Cormorant Garamond', serif;
      --font-body:    'Jost', sans-serif;
    }

    body {
      background: var(--ivory);
      color: var(--charcoal);
      font-family: var(--font-body);
      font-weight: 300;
      min-height: 100vh;
    }

    a { text-decoration: none; color: inherit; }

    /* ── NAVBAR ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 40px;
      position: relative;
    }

    .nav-logo {
      text-align: center;
    }

    .nav-logo h1 {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 10px;
      text-transform: uppercase;
      color: var(--charcoal);
      line-height: 1;
    }

    .nav-logo span {
      display: block;
      font-family: var(--font-body);
      font-size: 8px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--mink);
      margin-top: 4px;
    }

    .nav-icons {
      position: absolute;
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .nav-icon {
      width: 20px; height: 20px;
      stroke: var(--charcoal);
      fill: none;
      stroke-width: 1.2;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .nav-icon:hover { opacity: 1; }
    .nav-icon.active { opacity: 1; stroke: var(--charcoal); }

    /* ── PAGE TITLE ── */
    .page-title {
      text-align: center;
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--charcoal);
      margin-bottom: 40px;
      animation: fadeUp 0.7s ease both 0.1s;
    }

    /* ── PRODUCT GRID ── */
    .wishlist-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 800px;
      margin: 0 auto 44px;
      padding: 0 40px;
      animation: fadeUp 0.7s ease both 0.2s;
    }

    /* ── PRODUCT CARD ── */
    .prod-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .prod-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3/4;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .prod-placeholder {
      width: 100%;
      height: 100%;
      transition: transform 0.4s;
    }
    .prod-card:hover .prod-placeholder { transform: scale(1.03); }

    .btn-remove {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px; height: 26px;
      background: var(--ivory);
      border: 0.5px solid var(--blush);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .prod-card:hover .btn-remove { opacity: 1; }
    .btn-remove svg {
      width: 11px; height: 11px;
      stroke: var(--mink);
      fill: none;
      stroke-width: 1.5;
    }

    .prod-name {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 400;
      text-align: center;
      margin-bottom: 3px;
    }

    .prod-price {
      font-size: 11px;
      color: var(--mink);
      text-align: center;
    }

    /* ── BUTTON ── */
    .btn-wrap {
      display: flex;
      justify-content: center;
      animation: fadeUp 0.7s ease both 0.3s;
    }

    .btn-add-all {
      display: inline-block;
      padding: 14px 48px;
      background: var(--charcoal);
      color: var(--ivory);
      border: none;
      font-family: var(--font-body);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: lowercase;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .btn-add-all:hover { background: #1a1010; }

    /* ── ANIMATION ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <a href="index.html" class="nav-logo">
      <h1>Lumiere</h1>
      <span>Cosmetics</span>
    </a>
    <div class="nav-icons">
      <svg class="nav-icon active" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    </div>
  </nav>

  <!-- PAGE TITLE -->
  <p class="page-title">Wishlist</p>

  <!-- PRODUCT GRID -->
  <div class="wishlist-grid">

    <div class="prod-card">
      <div class="prod-img-wrap">
        <div class="prod-placeholder" style="background:#EDD8C8;"></div>
        <button class="btn-remove"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <p class="prod-name">Peptide Glazing Fluid</p>
      <p class="prod-price">Rs. 2,400</p>
    </div>

    <div class="prod-card">
      <div class="prod-img-wrap">
        <div class="prod-placeholder" style="background:#E4D0C8;"></div>
        <button class="btn-remove"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <p class="prod-name">Satin Lip Elixir</p>
      <p class="prod-price">Rs. 1,850</p>
    </div>

    <div class="prod-card">
      <div class="prod-img-wrap">
        <div class="prod-placeholder" style="background:#E8D8D0;"></div>
        <button class="btn-remove"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <p class="prod-name">Barrier Restore Moisturizer</p>
      <p class="prod-price">Rs. 3,200</p>
    </div>

  </div>

  <!-- ADD ALL TO CART -->
  <div class="btn-wrap">
    <button class="btn-add-all">add all items to cart</button>
  </div>

</body>
</html>
